<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Someone Special 💖</title>

<style>
body {
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', sans-serif;
  text-align: center;

  background: url('60DB54AC-25EE-481E-A9DA-98C42EF08BFB.png') no-repeat center center;
  background-size: cover;

  height: 100vh;
  width: 100vw;
  overflow: hidden;
}

/* Overlay */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  z-index: 0;
}

/* Content */
.content {
  position: relative;
  z-index: 1;
  padding-top: 15vh;
}

/* Heading */
h1 {
  color: white;
  font-size: 32px;
  text-shadow: 0 0 15px rgba(255,255,255,0.9);
}

/* Buttons */
.btn {
  padding: 15px 35px;
  font-size: 20px;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  margin: 15px;
  transition: 0.3s;
}

#yes {
  background: linear-gradient(45deg, #00c853, #69f0ae);
  color: white;
  box-shadow: 0 0 20px rgba(0,255,0,0.7);
}

#yes:hover {
  transform: scale(1.1);
}

#no {
  background: linear-gradient(45deg, #ff1744, #ff8a80);
  color: white;
  position: absolute;
}

/* Hearts */
.heart {
  position: fixed;
  color: #ff4d6d;
  animation: float 6s linear infinite;
  z-index: 0;
}

@keyframes float {
  from {
    transform: translateY(100vh);
    opacity: 1;
  }
  to {
    transform: translateY(-10vh);
    opacity: 0;
  }
}

/* Mobile responsive */
@media (max-width: 600px) {
  h1 {
    font-size: 22px;
  }

  .btn {
    font-size: 16px;
    padding: 12px 25px;
  }
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="content">
  <h1 id="question">
    Why are you waiting for? 💖<br>
    I like you, do you like me as my partner? 😍
  </h1>

  <button class="btn" id="yes">Yes 💚</button>
  <button class="btn" id="no">No 💔</button>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const question = document.getElementById("question");

/* NO button moves */
noBtn.addEventListener("mouseover", () => {
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
});

/* YES click */
yesBtn.addEventListener("click", () => {
  document.body.style.background = "linear-gradient(135deg, #a8ff78, #78ffd6)";
  document.body.innerHTML = `
    <h1 style="color:white;margin-top:40vh;">
      💖 Yayyy! I knew it 😍💍<br>
      Now you're mine 😏💖
    </h1>
  `;
});

/* Hearts */
setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💖";

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (Math.random() * 25 + 15) + "px";

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 6000);
}, 200);
</script>

</body>
</html>
